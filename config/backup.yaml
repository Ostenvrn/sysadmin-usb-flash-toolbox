# =====================================================================
# Конфигурация бэкапов.
# Профили: workstation, full_home, system, server.
# Кроссплатформенно: Linux + Windows.
# =====================================================================

backup_dir: output/backups
format: tar.gz
keep_last: 5
compress: true
verify_after_create: true

# =====================================================================
# ПРОФИЛЬ: Рабочий компьютер (данные)
# =====================================================================
workstation:
  name: "💻 Рабочий компьютер (данные)"
  description: "Личные файлы, проекты, настройки (Linux + Windows)"
  targets:
    # --- Общие для Linux и Windows ---
    - name: "Проекты"
      path: "~/projects"
      enabled: true

    # --- Windows ---
    - name: "Documents (Windows)"
      path: "~/Documents"
      enabled: true

    - name: "Downloads (Windows)"
      path: "~/Downloads"
      enabled: true

    - name: "Desktop (Windows)"
      path: "~/Desktop"
      enabled: true

    - name: "Pictures (Windows)"
      path: "~/Pictures"
      enabled: true

    # --- Linux ---
    - name: "Документы (Linux)"
      path: "~/Документы"
      enabled: true

    - name: "Загрузки (Linux)"
      path: "~/Загрузки"
      enabled: true

    - name: "Изображения (Linux)"
      path: "~/Изображения"
      enabled: true

    - name: "Рабочий стол (Linux)"
      path: "~/Рабочий стол"
      enabled: true

    # --- Настройки (общие) ---
    - name: "SSH-ключи"
      path: "~/.ssh"
      enabled: true

    - name: "Git-конфиг"
      path: "~/.gitconfig"
      enabled: true

    - name: "Bash-конфиг"
      path: "~/.bashrc"
      enabled: true

    - name: "PowerShell-профиль (Windows)"
      path: "~/Documents/WindowsPowerShell"
      enabled: false

  exclude:
    - "*.tmp"
    - "*.log"
    - "__pycache__"
    - ".cache"
    - "node_modules"
    - ".venv"
    - "venv"
    - ".npm"
    - ".cargo"
    - ".rustup"
    - ".buildozer"
    - "snap"
    - "AppData"

# =====================================================================
# ПРОФИЛЬ: Полный бэкап домашней папки
# =====================================================================
full_home:
  name: "🏠 Полный бэкап домашней папки"
  description: "Вся домашняя папка (кроме кэшей)"
  targets:
    - name: "Домашняя папка"
      path: "~"
      enabled: true
  exclude:
    # Кэши и временные (общие)
    - ".cache"
    - ".npm"
    - ".cargo"
    - ".rustup"
    # Linux
    - ".local/share/Trash"
    - "snap"
    - ".megaCmd"
    - ".steam"
    - ".local/share/Steam"
    - ".buildozer"
    - ".kivy"
    # Windows
    - "AppData/Local/Temp"
    - "AppData/Local/Microsoft/Windows/INetCache"
    - "AppData/Local/Packages"
    # Временные
    - "*.tmp"
    - "*.log"
    - "__pycache__"
    - "node_modules"
    # Бэкапы (не зацикливаемся)
    - "output/backups"
    - "projects/sysadmin-usb/output"

# =====================================================================
# ПРОФИЛЬ: Система (требует root/admin)
# =====================================================================
system:
  name: "🖥️ Система (требует root/admin)"
  description: "Конфиги, установленные программы. БЕЗ пользовательских данных."
  requires_root: true
  targets:
    - name: "Конфиги (/etc)"
      path: "/etc"
      enabled: true
    - name: "Программы (/usr/local)"
      path: "/usr/local"
      enabled: true
    - name: "Переменные данные (/var/lib)"
      path: "/var/lib"
      enabled: true
    - name: "Доп. софт (/opt)"
      path: "/opt"
      enabled: true
  exclude:
    - "*.tmp"
    - "*.log"
    - "__pycache__"
    - ".cache"
    - "node_modules"
    - "*.sock"
    - "*.pid"

# =====================================================================
# ПРОФИЛЬ: Сервер
# =====================================================================
server:
  name: "🖥️ Сервер"
  description: "Конфиги, БД, сайты"
  requires_root: true
  targets:
    - name: "Конфиги (/etc)"
      path: "/etc"
      enabled: true
    - name: "PostgreSQL"
      path: "/var/lib/postgresql"
      enabled: true
    - name: "MySQL"
      path: "/var/lib/mysql"
      enabled: true
    - name: "Сайты (/var/www)"
      path: "/var/www"
      enabled: true
    - name: "Домашние папки (/home)"
      path: "/home"
      enabled: true
    - name: "Root (/root)"
      path: "/root"
      enabled: true
    - name: "Доп. софт (/opt)"
      path: "/opt"
      enabled: true
  exclude:
    - "*.tmp"
    - "*.log"
    - "__pycache__"
    - ".cache"
    - "node_modules"
    - ".venv"
    - "venv"
