# =====================================================================
# Конфигурация бэкапов.
# =====================================================================

# Куда сохранять бэкапы (относительно корня проекта)
backup_dir: output/backups

# Формат архива: tar.gz или zip
format: tar.gz

# Что бэкапить
targets:
  # Пример: папка с документами
  - name: "Документы"
    path: "~/Documents"
    enabled: true

  # Пример: конфиги Linux
  - name: "Конфиги Linux"
    path: "/etc"
    enabled: false   # требует sudo

  # Пример: домашняя папка
  - name: "Домашняя папка"
    path: "~"
    enabled: false   # может быть большой

# Исключения (что НЕ бэкапить)
exclude:
  - "*.tmp"
  - "*.log"
  - "__pycache__"
  - ".cache"
  - "node_modules"
  - ".venv"
  - "venv"

# Хранить N последних бэкапов (старые удаляются)
keep_last: 5

# Сжимать архив
compress: true

# Проверять целостность после создания
verify_after_create: true
