# =====================================================================
# Основной конфиг sysadmin-usb.
# =====================================================================

app:
  name: sysadmin-usb
  version: 1.0.0
  log_level: INFO

web:
  host: 127.0.0.1
  port: 8080
  debug: false

categories:
  printers:
    enabled: true
    name: "🖨️ Принтеры"
    functions:
      - id: monitor
        name: "Мониторинг"
        enabled: true
      - id: auto_fix
        name: "Автопочинка"
        enabled: true
      - id: scanner
        name: "🔍 Сканер сети (найти сетевые принтеры)"
        enabled: true
      - id: local_scanner
        name: "🔌 Локальные принтеры (USB)"
        enabled: true
      - id: reports
        name: "Отчёты"
        enabled: true

  network:
    enabled: true
    name: "🌐 Сеть"
    functions:
      - id: diagnostics
        name: "🔧 Диагностика (ping, tracert, DNS, порты)"
        enabled: true
      - id: scan
        name: "📡 Сканирование подсети"
        enabled: true
      - id: map
        name: "🗺️ Карта сети"
        enabled: true
      - id: ports
        name: "🔍 Сканирование портов"
        enabled: true

  system:
    enabled: true
    name: "🖥️ Система"
    functions:
      - id: health_check
        name: "🏥 Диагностика ПК (Health Check)"
        enabled: true
      - id: info
        name: "Информация о ПК"
        enabled: true
      - id: cleanup
        name: "Очистка"
        enabled: true
      - id: update
        name: "Обновления"
        enabled: true

  backup:
    enabled: true
    name: "💾 Резервное копирование"
    functions:
      - id: create
        name: "📦 Создать бэкап (данные/система)"
        enabled: true
      - id: disk_image
        name: "🔴💿 ПОЛНЫЙ ОБРАЗ ДИСКА (ОПАСНО!)"
        enabled: true
      - id: verify
        name: "✅ Проверить бэкап"
        enabled: true
      - id: restore
        name: "♻️ Восстановить"
        enabled: true
      - id: list
        name: "📋 Список бэкапов"
        enabled: true

  ad:
    enabled: true
    name: "👤 Active Directory"
    functions:
      - id: users
        name: "👥 Пользователи (список, поиск, разблокировка)"
        enabled: true
      - id: audit
        name: "🔍 Аудит AD (отключённые, неактивные)"
        enabled: true
      - id: passwords
        name: "🔑 Аудит паролей (старые, неистекающие)"
        enabled: true

  reports:
    enabled: false
    name: "📊 Отчёты"
    functions:
      - id: generate
        name: "Сгенерировать отчёт"
        enabled: true
      - id: export
        name: "Экспорт (CSV/PDF)"
        enabled: true
