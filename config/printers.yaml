# =====================================================================
# Список принтеров для мониторинга.
#
# КАК ЗАПОЛНЯТЬ:
#   - name:    понятное имя (например, "Бухгалтерия HP-101")
#   - ip:      IP-адрес принтера
#   - model:   модель (для отчётов)
#   - location: где стоит
#   - snmp_community: SNMP-community (обычно "public")
#   - enabled: включён ли мониторинг
#
# ВАЖНО: перед добавлением принтера убедись, что на нём включён SNMP.
# =====================================================================

printers:
  - name: "Тестовый принтер"
    ip: "127.0.0.1"           # заглушка, замени на реальный IP
    model: "HP LaserJet"
    location: "Офис"
    snmp_community: "public"
    enabled: true

  # Пример реального принтера (раскомментируй и замени):
  # - name: "Бухгалтерия HP-101"
  #   ip: "192.168.1.101"
  #   model: "HP LaserJet Pro M404dn"
  #   location: "Бухгалтерия, 2 этаж"
  #   snmp_community: "public"
  #   enabled: true
